name: "🔥 Zümrüdüanka - PR Muayene ve GitHub Actions Otomasyonu"

on:
  # 1) Herhangi bir grup Pull Request (PR) açtığında veya güncellediğinde çalışır
  pull_request:
    branches: [ "main" ]
  # 2) Bir PR main dalına birleştirildiğinde (Merge) veya main'e push atıldığında çalışır
  push:
    branches: [ "main" ]
  # 3) GitHub arayüzünden manuel tetiklemeye izin verir
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================================
  # İŞ 1: ZÜMRÜDÜANKA PARÇA MUAYENESİ (CI - Sürekli Entegrasyon)
  # Grupların gönderdiği parcalar/<grup>.json dosyalarında sözdizimi (virgül/tırnak)
  # hatası olup olmadığını otomatik denetler ve derlenebilirliğini doğrular.
  # =========================================================================
  teknik-muayene:
    name: "🔥 Zümrüdüanka Parça Muayenesi (JSON & Derleme Kontrolü)"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Depo Kodunu İndir (Checkout)"
        uses: actions/checkout@v4

      - name: "🟢 Node.js Ortamını Hazırla"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "🔍 Anka Parçalarını Denetle ve Derlemeyi Doğrula (Nohut Dürüm CI Botu)"
        run: node scripts/muayene-kontrol.js


